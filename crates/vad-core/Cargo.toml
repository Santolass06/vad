[package]
name = "vad-core"
version = "0.1.0"
edition = "2021"
# Project license is the GPL-3.0 text in LICENSE. -only vs -or-later is a pending user decision
# (Sprint_17, task 1): until then the SPDX `license` field is deliberately NOT set.
license-file = "../../LICENSE"
publish = false
description = "Core playback and state management engine for VAD using libmpv"

[dependencies]
libmpv2 = "6.0.0"
crossbeam-channel = "0.5"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
