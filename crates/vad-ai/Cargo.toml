[package]
name = "vad-ai"
version = "0.1.0"
edition = "2021"
# Project license is the GPL-3.0 text in LICENSE. -only vs -or-later is a pending user decision
# (Sprint_17, task 1): until then the SPDX `license` field is deliberately NOT set.
license-file = "../../LICENSE"
publish = false
description = "VAD AI crate (Whisper, VAD, LLM providers, Summarization) - Milestone M3/M5"

[dependencies]
vad-core = { path = "../vad-core" }
whisper-rs = "0.16.0"
whisper-rs-sys = "0.15.0"
num_cpus = "1.16"
tracing = "0.1"
thiserror = "2.0"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
candle-core = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
url = "2.5.8"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sha2 = "0.10"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
