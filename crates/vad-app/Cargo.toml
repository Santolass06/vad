[package]
name = "vad-app"
version = "0.1.0"
edition = "2021"
# Project license is the GPL-3.0 text in LICENSE. -only vs -or-later is a pending user decision
# (Sprint_17, task 1): until then the SPDX `license` field is deliberately NOT set.
license-file = "../../LICENSE"
publish = false
description = "VAD video player desktop application with egui and OpenGL"

[dependencies]
vad-core = { path = "../vad-core" }
vad-ai = { path = "../vad-ai" }
vad-audio-tools = { path = "../vad-audio-tools" }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_glow = "0.36.2"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive"] }
num_cpus = "1.16"
mimalloc = "0.1.52"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
